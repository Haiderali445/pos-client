<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183c35" />
      <stop offset="100%" stop-color="#2d8a55" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2c14e" />
      <stop offset="100%" stop-color="#d4a337" />
    </linearGradient>
  </defs>

  <!-- Background Card / Frame -->
  <rect x="5" y="5" width="390" height="110" rx="16" fill="#ffffff" stroke="#e0e6e2" stroke-width="2" />

  <!-- Logo Mark Icon Background -->
  <rect x="20" y="20" width="80" height="80" rx="12" fill="url(#posGrad)" />

  <!-- Barcode / Terminal Icon Inside Mark -->
  <g transform="translate(32, 42)" fill="url(#goldGrad)">
    <rect x="0" y="0" width="4" height="28" rx="2" />
    <rect x="7" y="0" width="7" height="28" rx="2" />
    <rect x="17" y="0" width="3" height="28" rx="1.5" />
    <rect x="23" y="0" width="6" height="28" rx="2" />
    <rect x="32" y="0" width="3" height="28" rx="1.5" />
    <rect x="38" y="0" width="5" height="28" rx="2" />
    <rect x="46" y="0" width="8" height="28" rx="2" />
  </g>

  <!-- Accent Corner Dot -->
  <circle cx="86" cy="30" r="6" fill="#f2c14e" />

  <!-- Typography: Brand Name -->
  <text x="116" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#183c35">
    Hardware Point
  </text>

  <!-- Typography: Subtitle / Tagline -->
  <text x="118" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#718076" letter-spacing="2">
    RETAIL OPERATIONS PLATFORM
  </text>
</svg>
